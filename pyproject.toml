[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-mnist-mlops"
version = "0.1.0"
description = "Train, track, store, and serve a Fashion-MNIST classifier with MLflow and MinIO"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "mlflow>=2.13.0,<3.0.0",
    "minio>=7.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "streamlit>=1.36.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "pillow>=10.3.0",
    "numpy>=1.25.0",
]

[project.optional-dependencies]
# Install these tools for local validation with `pip install -e ".[dev]"`.
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
# Let tests import the package directly from the src layout.
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
train-model = "fashion_mnist_mlop.train:main"
serve-api = "fashion_mnist_mlop.api:main"
